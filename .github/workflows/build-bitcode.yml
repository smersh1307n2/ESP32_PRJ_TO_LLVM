name: Build ESPB LLVM bitcode examples

on:
  workflow_dispatch:
    inputs:
      translate_espb:
        description: "Translate the generated .bc corpus through the ESPB API"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - experiment/espb-runtime-corpus
    paths:
      - "examples/**"
      - "scripts/build_bitcode.py"
      - "CMakeLists.txt"
      - ".github/workflows/build-bitcode.yml"

jobs:
  build-bitcode:
    runs-on: ubuntu-latest
    env:
      ESPB_API_KEY: ${{ secrets.ESPB_API_KEY }}
    container:
      image: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install ESP Clang
        shell: bash
        run: |
          python "$IDF_PATH/tools/idf_tools.py" install esp-clang
          CLANG="$(find -L /opt/esp/tools/esp-clang -type f -path "*/bin/clang" -perm -111 -print -quit)"
          if [ -z "$CLANG" ]; then
            echo "ESP Clang executable not found after installation"
            find -L /opt/esp/tools/esp-clang -maxdepth 6 -type f -print | head -n 40 || true
            exit 1
          fi
          CLANG_BIN="$(dirname "$CLANG")"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          echo "ESPB_CLANG=$CLANG" >> "$GITHUB_ENV"
      - name: Generate LLVM bitcode
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          for example in examples/01_integer examples/02_control_flow examples/03_memory examples/04_calls; do
            python scripts/build_bitcode.py "$example"
          done
      - name: Upload bitcode corpus
        uses: actions/upload-artifact@v4
        with:
          name: espb-llvm-bitcode
          path: |
            llvm_output/01_integer_integer.bc
            llvm_output/02_control_flow_control_flow.bc
            llvm_output/03_memory_memory.bc
            llvm_output/04_calls_calls.bc
          if-no-files-found: error
          retention-days: 30

      - name: Install .NET SDK
        if: inputs.translate_espb && env.ESPB_API_KEY != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Translate bitcode to ESPB
        if: inputs.translate_espb && env.ESPB_API_KEY != ''
        shell: bash
        run: |
          git clone --depth 1 --branch experiment/espb-cli-translator https://github.com/smersh1307n2/ESPB_Desktop_Client.git tools/espb-client
          mkdir -p espb_output
          for bc in llvm_output/01_integer_integer.bc llvm_output/02_control_flow_control_flow.bc llvm_output/03_memory_memory.bc llvm_output/04_calls_calls.bc; do
            name="$(basename "$bc" .bc)"
            dotnet run --project tools/espb-client/ESPB.Cli/ESPB.Cli.csproj -c Release -- --bc "$bc" --out "espb_output/test_$name.espb"
          done

      - name: Upload ESPB modules
        if: inputs.translate_espb && env.ESPB_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: espb-translated-modules
          path: espb_output/*.espb
          if-no-files-found: error
          retention-days: 30

      - name: Explain translation status
        if: ${{ !inputs.translate_espb || env.ESPB_API_KEY == '' }}
        shell: bash
        run: |
          if [ "${{ inputs.translate_espb }}" != "true" ]; then
            if [ -n "$ESPB_API_KEY" ]; then
              echo "Translation skipped: API secret is configured; dispatch manually with translate_espb=true."
            else
              echo "Translation skipped: add the ESPB_API_KEY repository secret, then dispatch with translate_espb=true."
            fi
          else
            echo "Translation requested but ESPB_API_KEY repository secret is missing."
          fi
