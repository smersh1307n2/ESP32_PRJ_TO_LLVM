name: Build ESPB LLVM bitcode examples

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/espb-runtime-corpus
    paths:
      - "examples/**"
      - "scripts/build_bitcode.py"
      - "CMakeLists.txt"
      - ".github/workflows/build-bitcode.yml"

jobs:
  build-bitcode:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install ESP Clang
        shell: bash
        run: |
          python "$IDF_PATH/tools/idf_tools.py" install esp-clang
          CLANG_BIN="$(find /opt/esp/tools/esp-clang -type f -name clang -perm -111 -printf '%h\\n' | head -n 1)"
          if [ -z "$CLANG_BIN" ]; then
            echo "ESP Clang executable not found after installation"
            find /opt/esp/tools/esp-clang -maxdepth 5 -type f | head -n 40
            exit 1
          fi
          LLVM_LINK="$(find "$CLANG_BIN" -maxdepth 1 -type f -name llvm-link -perm -111 | head -n 1)"
          if [ -z "$LLVM_LINK" ]; then
            echo "llvm-link not found beside clang"
            find /opt/esp/tools/esp-clang -type f -name llvm-link | head -n 20
            exit 1
          fi
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          echo "ESPB_CLANG=$CLANG_BIN/clang" >> "$GITHUB_ENV"
          echo "ESPB_LLVM_LINK=$LLVM_LINK" >> "$GITHUB_ENV"
      - name: Generate LLVM bitcode
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          for example in examples/01_integer examples/02_control_flow examples/03_memory examples/04_calls; do
            python scripts/build_bitcode.py "$example"
          done
      - name: Upload bitcode corpus
        uses: actions/upload-artifact@v4
        with:
          name: espb-llvm-bitcode
          path: llvm_output/*.bc
          if-no-files-found: error
          retention-days: 30
